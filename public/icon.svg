      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="113" fill="url(#plate)"/>
  <g fill="#ffffff">
    <path d="M112.6 399.4V301.9a31.5 31.5 0 0 1 63.1 0v97.5z"/>
    <path d="M224.5 399.4V215.9a31.5 31.5 0 0 1 63 0v183.5z"/>
