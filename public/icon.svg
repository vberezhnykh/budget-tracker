<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BudgetPro">
  <!-- Тот же рисунок, что у PNG-иконок (см. scripts/generate-icons.mjs):
       столбики диаграммы на фирменном градиенте из src/index.css.
       Отдельным файлом, потому что фавикон в браузере отдаётся вектором, а
