# Прогон тех же проверок, что запускаются локально: линт, модульные тесты,
# сборка и смоук-сьют в реальном браузере.
#
# База нужна только тестам роутов (server/routes.*.test.js, server/seed.test.js):
# они работают на настоящей MongoDB, потому что проверяют как раз то, чего мок
# не покажет, - что запись легла в документ, что каскад отработал, что поле
# исчезло. Остальные серверные тесты чистые, а Playwright подменяет каждый
# вызов /api/** фикстурой (см. e2e/fixtures.js), поэтому сервис поднимается
# только в работе checks.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Пуш в ту же ветку отменяет предыдущий, ещё не доехавший прогон: смысла
# дожидаться проверок устаревшего коммита нет.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Быстрые проверки одной работой: каждая занимает секунды, и разносить их
  # по отдельным job'ам значило бы трижды платить за установку зависимостей.
  checks:
    name: Линт, тесты, сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Запустить MongoDB replica set
        run: docker run --detach --name budget-tracker-test-mongo --publish 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all

      - name: Дождаться и инициализировать MongoDB replica set
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker exec budget-tracker-test-mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok === 1" | grep -q true; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'MongoDB did not answer ping' >&2
              exit 1
            fi
            sleep 1
          done
          docker exec budget-tracker-test-mongo mongosh --quiet --eval "try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}); } catch (e) { if (e.codeName !== 'AlreadyInitialized') { print(e); quit(1); } }"
          for attempt in {1..60}; do
            if docker exec budget-tracker-test-mongo mongosh --quiet --eval "try { const hello = db.hello(); if (hello.isWritablePrimary === true) quit(0); quit(1); } catch (e) { quit(1); }"; then
              exit 0
            fi
            sleep 1
          done
          echo 'MongoDB replica set did not become primary' >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          # Та же мажорная версия, что и локально; Vite 7 требует минимум
          # Node 20.19/22.12.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # postinstall из package.json ставит заодно зависимости server/,
      # поэтому отдельного шага для бэкенда не нужно.
      - run: npm ci

      - run: npm run lint

      # vitest прогоняет и фронтенд (jsdom), и тесты сервера:
      # server/*.test.js подхватываются тем же конфигом, e2e/ исключён.
      - run: npm test
        env:
          MONGODB_URI_TEST: mongodb://localhost:27017/budget-tracker-test?replicaSet=rs0

      # Сборка ловит то, что не ловят тесты: битые импорты и всё, что
      # разъезжается только при продакшен-бандлинге.
      - run: npm run build

      - name: Остановить MongoDB replica set
        if: always()
        run: docker rm --force budget-tracker-test-mongo || true

  e2e:
    name: Смоук в браузере
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci

      # Браузер кладётся в кеш по версии playwright из package-lock.json:
      # обновится зависимость - сменится ключ, и Chromium скачается заново.
      - name: Кеш браузера Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Только Chromium: сьют явно фиксирует browserName: 'chromium'
      # (см. playwright.config.js), остальные движки тянуть незачем.
      # При попадании в кеш сам браузер уже на месте, но системные
      # библиотеки под него в образе раннера - нет, их ставим всегда.
      - name: Установить Chromium
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Установить системные зависимости
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: npm run test:e2e

      # Скриншоты и контекст падений: без них красный прогон геометрического
      # теста невозможно разобрать, не воспроизведя его руками.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
